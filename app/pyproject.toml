[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "karospace-agent"
version = "0.1.0"
description = "Build KaroSpace spatial-transcriptomics viewers with Claude or Codex and local sanitizing tools."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk>=0.2",
    "mcp>=1.0,<3",
    "jsonschema>=4",
    "pydantic>=2",
]

[project.optional-dependencies]
offline = [
    "mlx-lm>=0.31,<0.32; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
web = [
    "starlette>=0.40",
    "uvicorn>=0.30",
]
# The native desktop window (`karospace-agent app`). Includes the web extra —
# it serves the same Starlette app — plus pywebview for the window and
# pyinstaller for building the signed/notarized `.app` bundle.
app = [
    "karospace-agent[web]",
    "pywebview>=5.0",
    "pyinstaller>=6.0",
]

[project.scripts]
karospace-agent = "karospace_agent.cli:main"
karospace-agent-mcp = "karospace_agent.mcp:main"

[tool.setuptools]
packages = ["karospace_agent"]

[tool.setuptools.package-data]
karospace_agent = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
