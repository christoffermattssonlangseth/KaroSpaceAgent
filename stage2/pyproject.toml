[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "karospace-agent"
version = "0.1.0"
description = "Stage 2 of KaroSpaceAgent: a Claude Agent SDK app that drives the karospace CLI to build spatial-transcriptomics viewers, with the local-hands / Claude-brain / sanitized-metadata-only boundary enforced in code."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk>=0.2",
]

[project.scripts]
karospace-agent = "karospace_agent.cli:main"

[tool.setuptools]
packages = ["karospace_agent"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
